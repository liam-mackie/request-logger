apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-logger
  namespace: request-logger
  labels:
    app.kubernetes.io/name: request-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: request-logger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: request-logger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric uid: the kubelet cannot verify distroless's named "nonroot" user.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: request-logger
          image: ghcr.io/liam-mackie/request-logger:sha-cc08a28a73ba09963f17ee55b06f1ca49676aa82
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # TCP probes: an HTTP probe would log a request every few seconds.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
