# Gateway API route for plaintext :80. The shared Contour Gateway's :443
# listener uses Contour's mixed-mode `projectcontour.io/https` protocol, which
# accepts no route kinds, so TLS is handled by httpproxy.yaml instead.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: request-logger
  namespace: request-logger
spec:
  parentRefs:
    - name: contour
      namespace: projectcontour
      sectionName: http
  hostnames:
    - webhooks.gke.beans.sh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: request-logger
          port: 8080
